<script>
// ── TREE DATA ──────────────────────────────────────────────────────────────

        },

// ── LAYOUT ─────────────────────────────────────────────────────────────────
const CX = 900, CY = 650;
TREE.x = CX; TREE.y = CY;

function placeChildren(parent, outAngle, spread, dist) {
  if (!parent.children) return;
  const n = parent.children.length;
  parent.children.forEach((child, i) => {
    const offset = n === 1 ? 0 : (i / (n - 1) - 0.5) * spread;
    const angle  = outAngle + offset;
    const rad    = angle * Math.PI / 180;
    child.x = parent.x + dist * Math.cos(rad);
    child.y = parent.y + dist * Math.sin(rad);
    child.fill     = child.fill     || parent.fill;
    child.textFill = child.textFill || parent.textFill;
    child._angle   = angle;
    placeChildren(child, angle, child.childSpread || 88, child.childDist || 88);
  });
}

TREE.children.forEach(cat => {
  const rad = cat.catAngle * Math.PI / 180;
  cat.x = CX + cat.catDist * Math.cos(rad);
  cat.y = CY + cat.catDist * Math.sin(rad);
  placeChildren(cat, cat.catAngle, cat.childSpread, cat.childDist);
});

// ── RENDER ─────────────────────────────────────────────────────────────────
const svg = document.getElementById('skills-svg');
const NS  = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

// Draw all connector lines first (behind circles)
function drawLines(node) {
  if (!node.children) return;
  node.children.forEach(child => {
    svg.appendChild(svgEl('line', {
      x1: node.x, y1: node.y, x2: child.x, y2: child.y,
      stroke: '#ccc', 'stroke-width': '1.5', 'stroke-linecap': 'round'
    }));
    drawLines(child);
  });
}
drawLines(TREE);

// Split text into 1 or 2 lines that fit comfortably in a circle
function splitText(name) {
  const words = name.split(' ');
  if (words.length <= 1) return [name];
  // Find the split that balances line lengths
  let best = 1, bestDiff = Infinity;
  let running = 0;
  const total = name.length;
  for (let i = 0; i < words.length - 1; i++) {
    running += words[i].length + 1;
    const diff = Math.abs(running - total / 2);
    if (diff < bestDiff) { bestDiff = diff; best = i + 1; }
  }
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
}

function drawNode(node, isRoot) {
  const g = svgEl('g', { class: 'bubble-node', transform: `translate(${node.x},${node.y})` });

  // Circle
  const circle = svgEl('circle', {
    cx: 0, cy: 0, r: node.r,
    fill: node.fill || '#e8e5df',
    stroke: 'white',
    'stroke-width': '2.5'
  });
  g.appendChild(circle);

  // Font size scales with circle radius
  const fs = isRoot ? 18 : node.r >= 55 ? 14 : node.r >= 38 ? 12 : node.r >= 28 ? 10 : 9;
  const fw = node.r >= 38 ? '600' : '500';
  const lines = splitText(node.name);

  const textEl = svgEl('text', {
    'text-anchor': 'middle',
    'font-family': 'DM Sans, sans-serif',
    'font-size': fs,
    'font-weight': fw,
    fill: node.textFill || '#1a1a18',
    'pointer-events': 'none'
  });

  if (lines.length === 1) {
    textEl.setAttribute('dominant-baseline', 'central');
    textEl.textContent = lines[0];
  } else {
    const dy0 = -(fs * 0.62);
    const dy1 =   fs * 1.18;
    const t1 = svgEl('tspan', { x: 0, dy: dy0 });
    t1.textContent = lines[0];
    const t2 = svgEl('tspan', { x: 0, dy: dy1 });
    t2.textContent = lines[1];
    textEl.appendChild(t1);
    textEl.appendChild(t2);
  }

  g.appendChild(textEl);
  svg.appendChild(g);
}

// Draw nodes (root first, so it sits on top of everything)
function drawAllNodes(node, isRoot) {
  if (node.children) node.children.forEach(c => drawAllNodes(c, false));
  drawNode(node, isRoot);
}
drawAllNodes(TREE, true);
</script>
